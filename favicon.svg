<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Grid Lines -->
  <line x1="24" y1="12" x2="24" y2="52" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round" />
  <line x1="40" y1="12" x2="40" y2="52" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round" />
  <line x1="12" y1="24" x2="52" y2="24" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round" />
  <line x1="12" y1="40" x2="52" y2="40" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round" />

  <!-- X Icon Top Left -->
  <line x1="15" y1="15" x2="21" y2="21" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <line x1="21" y1="15" x2="15" y2="21" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

  <!-- O Icon Center -->
  <circle cx="32" cy="32" r="4.5" fill="none" stroke="#ffffff" stroke-width="3.5" />

  <!-- X Icon Bottom Right -->
  <line x1="43" y1="43" x2="49" y2="49" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <line x1="49" y1="43" x2="43" y2="49" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
</svg>
