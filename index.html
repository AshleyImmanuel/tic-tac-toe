<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Tic-Tac-Toe | Modern Light Aesthetic Game</title>
  <meta name="description" content="Play high-aesthetic Tic-Tac-Toe in 3x3, 4x4, and 5x5 grids with local 2-Player or Unbeatable Minimax AI. Features procedural sounds, particle FX, and crisp SVG design.">
  <meta name="theme-color" content="#f0f4ff">

  <!-- SEO Open Graph -->
  <meta property="og:title" content="Premium Tic-Tac-Toe | Modern Light Aesthetic">
  <meta property="og:description" content="Elevated Tic-Tac-Toe experience featuring single player Minimax AI, 2 player local mode, Web Audio sounds, confetti FX, and sleek SVG interface.">
  <meta property="og:type" content="website">

  <!-- Stylesheet & Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Light Background Blobs -->
  <div class="bg-ambient" aria-hidden="true">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
  </div>

  <!-- HTML5 Canvas Celebration Confetti -->
  <canvas id="confetti-canvas"></canvas>

  <div class="app-container">

    <!-- Header Navigation -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </div>
        <h1 class="brand-title">Tic Tac Toe</h1>
      </div>

      <div class="header-actions">
        <button id="sound-toggle" class="icon-btn" aria-label="Toggle Sound" data-tooltip="Mute Sound">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>

        <button id="history-btn" class="icon-btn" aria-label="Match History" data-tooltip="Match History">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8v4l3 3"/>
            <circle cx="12" cy="12" r="9"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Game Configuration Bar -->
    <section class="config-card" aria-label="Game Settings">
      <!-- Mode Selection -->
      <div class="config-row">
        <div class="segmented-control" role="tablist" aria-label="Game Mode">
          <button id="mode-pvp" class="segment-btn active" role="tab" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            2 Player (PvP)
          </button>
          <button id="mode-pve" class="segment-btn" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="11" width="18" height="10" rx="2"/>
              <circle cx="12" cy="5" r="2"/>
              <path d="M12 7v4"/>
              <line x1="8" y1="16" x2="8" y2="16.01"/>
              <line x1="16" y1="16" x2="16" y2="16.01"/>
            </svg>
            Vs AI (PvE)
          </button>
        </div>

        <!-- Grid Size Selection -->
        <div class="segmented-control" role="tablist" aria-label="Grid Size">
          <button id="grid-3" class="segment-btn active" role="tab">3x3</button>
          <button id="grid-4" class="segment-btn" role="tab">4x4</button>
          <button id="grid-5" class="segment-btn" role="tab">5x5</button>
        </div>
      </div>

      <!-- AI Difficulty Bar (Visible when Mode is PvE) -->
      <div id="difficulty-wrapper" class="difficulty-wrapper hidden">
        <div class="difficulty-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          Difficulty:
        </div>
        <div class="segmented-control" role="tablist" aria-label="AI Difficulty">
          <button id="diff-easy" class="segment-btn" role="tab">Easy</button>
          <button id="diff-medium" class="segment-btn active" role="tab">Medium</button>
          <button id="diff-impossible" class="segment-btn" role="tab">Impossible</button>
        </div>
      </div>
    </section>

    <!-- Scoreboard & Status Banner -->
    <section class="status-card" aria-label="Scoreboard and Status">
      <div class="scoreboard">
        <!-- Player X Score -->
        <div class="score-box player-x">
          <div class="score-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
            Player X
          </div>
          <div id="score-x" class="score-value">0</div>
        </div>

        <!-- Ties Score -->
        <div class="score-box ties">
          <div class="score-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5v14"/>
            </svg>
            Draws
          </div>
          <div id="score-ties" class="score-value">0</div>
        </div>

        <!-- Player O / AI Score -->
        <div class="score-box player-o">
          <div class="score-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <circle cx="12" cy="12" r="8"/>
            </svg>
            <span id="label-o">Player O</span>
          </div>
          <div id="score-o" class="score-value">0</div>
        </div>
      </div>

      <!-- Turn Banner -->
      <div class="turn-banner">
        <div class="turn-status">
          <div id="turn-badge" class="turn-badge is-x">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </div>
          <span id="turn-text">Player X's Turn</span>
        </div>

        <!-- Timer -->
        <div id="timer-display" class="timer-display">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          00:00
        </div>
      </div>
    </section>

    <!-- Main Game Board -->
    <main class="board-stage">
      <div class="grid-wrapper">
        <!-- SVG Winning Strike-Through Line Container -->
        <svg id="win-line-svg" class="win-line-svg"></svg>

        <!-- Grid Cells -->
        <div id="board-grid" class="tic-tac-grid" role="grid" aria-label="Tic Tac Toe Game Board"></div>
      </div>
    </main>

    <!-- Action Controls (Undo, Reset) -->
    <footer class="controls-card">
      <button id="undo-btn" class="btn" disabled aria-label="Undo Last Move">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"/>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
        </svg>
        Undo
      </button>

      <button id="reset-btn" class="btn btn-primary" aria-label="Restart Match">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6"/>
          <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        New Match
      </button>

      <div style="visibility: hidden;"></div>
    </footer>

  </div>

  <!-- History Modal Overlay -->
  <div id="history-modal" class="modal-backdrop" role="dialog" aria-labelledby="history-title" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="history-title" class="modal-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 8v4l3 3"/>
            <circle cx="12" cy="12" r="9"/>
          </svg>
          Session Match History
        </h2>
        <button id="close-history" class="icon-btn" aria-label="Close modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div id="history-list" class="history-list"></div>

      <button id="clear-history" class="btn" style="margin-top: 8px;">Clear History</button>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/audio.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/minimax.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
